apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-server

spec:
  capacity:
    storage: 8Gi
  accessModes: 
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  nfs:
    server: 192.168.1.50
    path: /mnt/truenas-pool-1/data/persistent-volumes/prometheus-server
  volumeMode: Filesystem

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-alertmanager
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  nfs:
    server: 192.168.1.50
    path: /mnt/truenas-pool-1/data/persistent-volumes/prometheus-alertmanager
  volumeMode: Filesystem

