apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-config
  labels:
    app: jellyfin
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  nfs:
    server: 192.168.1.50
    path: /mnt/truenas-pool-1/data/jellyfin-config
  volumeMode: Filesystem


---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-cache
  labels:
    app: jellyfin
spec:
  capacity:
    storage: 500Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: nfs-csi
  nfs:
    server: 192.168.1.50
    path: /mnt/truenas-pool-1/data/jellyfin-cache
  volumeMode: Filesystem

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media
  labels:
    app: jellyfin
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  nfs:
    server: 192.168.1.50
    path: /mnt/truenas-pool-1/data/jellyfin-media
  volumeMode: Filesystem


---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: jellyfin
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Mi
  selector:
    matchLabels:
      app: jellyfin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-cache
  namespace: jellyfin
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  selector:
    matchLabels:
      app: jellyfin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media
  namespace: jellyfin
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      app: jellyfin
