apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-pv
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  persistentVolumeReclaimPolicy: Retain
   nfs:
    server: 192.168.1.50
    path: /mnt/truenas-pool-1/data/persistent-volumes/grafana-pv
  volumeMode: Filesystem

